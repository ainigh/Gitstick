name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  engine-linux:
    name: Engine tests (Linux)
    runs-on: ubuntu-latest
    container: swift:5.10
    steps:
      - uses: actions/checkout@v4
      - name: Install git
        run: apt-get update -q && apt-get install -y -q git
      - name: Build
        run: swift build --build-tests
      - name: Test
        run: swift test

  app-macos:
    name: App build (macOS)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build everything (engine, CLI, menubar app)
        run: swift build
      - name: Test
        run: swift test
