name: CI

# Every push: test the engine on Linux, build and test everything on macOS. A push to main also
# publishes the app as a GitHub release, which is what the app's updater and install.sh download.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  engine-linux:
    name: Engine tests (Linux)
    runs-on: ubuntu-latest
    container: swift:5.10
    steps:
      - uses: actions/checkout@v4
      - name: Install git
        run: apt-get update -q && apt-get install -y -q git
      - name: Build
        run: swift build --build-tests
      - name: Test
        run: swift test

  app-macos:
    name: App build (macOS)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build everything (engine, CLI, menubar app)
        run: swift build
      - name: Test
        run: swift test
      - name: Package the app
        run: |
          echo "VERSION=0.3.${{ github.run_number }}" >> "$GITHUB_ENV"
          VERSION="0.3.${{ github.run_number }}" COMMIT="$GITHUB_SHA" UNIVERSAL=1 ./Scripts/make-app.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Gitstick
          path: dist/Gitstick.zip
      - name: Release
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        # A re-run keeps its run number, so the release may already exist: replace its zip.
        run: |
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            gh release upload "v$VERSION" dist/Gitstick.zip --clobber
          else
            gh release create "v$VERSION" dist/Gitstick.zip --target "$GITHUB_SHA" \
              --title "Gitstick $VERSION" --notes "$(git log -1 --format=%B)"
          fi
